# mono-theme.conf — monochrome kitty theme
# Place in ~/.config/kitty/ and swap the include line in kitty.conf:
#   include mono-theme.conf
# Kaguya stays in kaguya-theme.conf if you want to switch back.

# --- Transparency ---------------------------------------------------------
# 0.0 = fully clear, 1.0 = solid. 0.55 is near-transparent but still readable
# over a bright wallpaper. Opacity changes need a full kitty restart.
background_opacity 0.0
# Blur behind the window (works on KDE Wayland with KWin's Blur effect on).
# Set to 0 for clear glass instead of frosted.
background_blur 55
# Lets you change opacity live: ctrl+shift+a, then m (more) / l (less)
dynamic_background_opacity yes

# --- Base colours ---------------------------------------------------------
foreground              #d4d4d4
background              #0e0e0e
selection_foreground    #ffffff
selection_background    #3a3a3a
cursor                  #e6e6e6
cursor_text_color       #0e0e0e
url_color               #a8a8a8

# --- Borders and tabs -----------------------------------------------------
active_border_color     #8a8a8a
inactive_border_color   #2a2a2a
bell_border_color       #f0f0f0
active_tab_foreground   #0e0e0e
active_tab_background   #d4d4d4
inactive_tab_foreground #7a7a7a
inactive_tab_background #1a1a1a
tab_bar_background      none

# --- 16 ANSI colours (greyscale) ------------------------------------------
# Programs still "use" red/green etc.; here those map to different grey
# brightnesses, so errors and diffs stay distinguishable by lightness.

# black
color0  #1c1c1c
color8  #4a4a4a
# red
color1  #7a7a7a
color9  #9a9a9a
# green
color2  #a0a0a0
color10 #c0c0c0
# yellow
color3  #8c8c8c
color11 #b0b0b0
# blue
color4  #6e6e6e
color12 #929292
# magenta
color5  #858585
color13 #a8a8a8
# cyan
color6  #b4b4b4
color14 #d0d0d0
# white
color7  #c8c8c8
color15 #f0f0f0

# --- Optional: barely-there tints -----------------------------------------
# If pure grey makes git diffs / pacman errors too hard to read, uncomment
# these to give red and green the faintest hint of colour.
# color1  #8a6e6e
# color9  #a88a8a
# color2  #7a8a7a
# color10 #98a898
